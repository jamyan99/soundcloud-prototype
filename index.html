<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SoundCloud Redesign Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <!-- SoundCloud's official Widget API: streams the real tracks -->
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <!-- Figma capture helper: only loads with ?capture in the URL, never for testers -->
  <script>
    if (new URLSearchParams(location.search).has('capture')) {
      const s = document.createElement('script');
      s.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
      s.async = true;
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="stage"><div id="device"><div id="app"></div></div></div>
  <div id="sc-host" aria-hidden="true"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
